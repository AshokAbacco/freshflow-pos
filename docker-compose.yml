# Local PostgreSQL for development.
# Start it with:  docker compose up -d
# The default DATABASE_URL in server/.env.example points at this container.
services:
  db:
    image: postgres:16-alpine
    container_name: freshflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freshflow
    ports:
      - '5432:5432'
    volumes:
      - freshflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d freshflow']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  freshflow-db-data:
